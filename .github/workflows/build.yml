name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil whisper.cpp (gratis, open source)
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git whisper.cpp
          L=whisper.cpp/examples/whisper.android/lib
          J=$L/src/main/jni/whisper/jni.c
          rm -f $L/build.gradle $L/build.gradle.kts
          cat > $L/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.whispercpp.whisper"
              compileSdk = 34
              defaultConfig {
                  minSdk = 29
                  ndk { abiFilters += listOf("arm64-v8a") }
                  externalNativeBuild { cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") } }
              }
              externalNativeBuild { cmake { path = file("src/main/jni/whisper/CMakeLists.txt") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1") }
          EOF
          sed -i 's/params.language = "en"/params.language = "id"/' $J
          sed -i 's/params.single_segment = false;/params.single_segment = false; params.language = "id";/' $J
          grep -n 'language' $J || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceOverFix-apk
          path: app/build/outputs/apk/debug/*.apk
